name: Public demo validation

on:
  push:
    branches:
      - release/public-clean-root
      - improve/api-safety-reliability-20261013
      - main
  pull_request:
    branches:
      - main
      - release/public-clean-root
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-synthetic-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q api.py main.py scheduler.py scheduler_performance.py aptech_ara.py tests
      - name: Check API startup and health
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api import app
          client = TestClient(app)
          response = client.get("/health")
          assert response.status_code == 200, response.text
          assert response.json() == {"status": "ok"}, response.text
          PY
      - name: Run synthetic scheduling tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Package clean source
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          files = [name for name in files if name]
          output = Path("dist/ADEX-final-source.zip")
          output.parent.mkdir(exist_ok=True)
          with ZipFile(output, "w", compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  archive.write(name, arcname="ADEX-Academic-Scheduling/" + name)
          print(f"Packaged {len(files)} tracked files to {output}")
          PY
      - name: Upload complete source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ADEX-final-source
          path: dist/ADEX-final-source.zip
          if-no-files-found: error
          retention-days: 7
