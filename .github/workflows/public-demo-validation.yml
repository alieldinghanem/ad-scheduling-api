name: Public demo validation

on:
  push:
    branches:
      - review/public-portfolio-preparation-20261013
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-synthetic-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q api.py main.py scheduler.py scheduler_performance.py aptech_ara.py tests
      - name: Check API startup and health
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from api import app
          client = TestClient(app)
          response = client.get("/health")
          assert response.status_code == 200, response.text
          assert response.json() == {"status": "ok"}, response.text
          PY
      - name: Run synthetic scheduling tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
