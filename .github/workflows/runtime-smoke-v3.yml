name: Runtime smoke v3

on:
  push:
    branches:
      - release/public-clean-root
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile api.py main.py scheduler.py scheduler_performance.py sitecustomize.py
      - name: Import API
        run: |
          python - <<'PY'
          import api
          assert api.SCHEDULE_OUTPUT_VERSION == '20260910-render-low-memory-v3'
          print('api import ok')
          PY
      - name: Normalize synthetic demo payload
        run: |
          python - <<'PY'
          from pathlib import Path
          from main import load_json_from_file, normalize_payload
          payload = load_json_from_file(Path('sample_data/demo_academic_input.json'))
          normalized = normalize_payload(payload)
          assert normalized['semesterId'] == 999
          assert len(normalized['regularCourses']) == 2
          assert len(normalized['rooms']) == 3
          print('Synthetic input normalized')
          PY
      - name: Run complete synthetic scheduler
        run: |
          python -m unittest tests/test_synthetic_schedule.py -v
