name: Scheduler smoke test

on:
  push:
    branches:
      - fix/final-scheduler-performance
  pull_request:
    branches:
      - main

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile api.py main.py scheduler.py scheduler_performance.py sitecustomize.py tests/test_smoke.py

      - name: Run smoke tests
        run: python -m unittest tests/test_smoke.py
